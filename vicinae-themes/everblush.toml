[meta]
name        = "everblush"
description = "Generated by set_theme.fish"
variant     = "dark"
inherits    = "vicinae-dark"

[colors.core]
accent               = "#e57474"
accent_foreground    = "#0e1416"
background           = "#141b1e"
foreground           = "#dadada"
secondary_background = "#141b1e"
border               = "colors.core.background"

[colors.main_window]
border = "colors.core.background"
footer = { background = "colors.core.secondary_background" }

[colors.settings_window]
border = "colors.core.border"

[colors.accents]
blue    = "#6cbfbf"
green   = "#8ccf7e"
magenta = "#de8f8f"
orange  = "#d68c67"
red     = "#e57474"
yellow  = "#e5c76b"
cyan    = "#6cbfbf"
purple  = "#c47fd5"

[colors.shortcut]
border = "colors.core.border"

[colors.text]
default     = "#dadada"
muted       = "#3b4244"
danger      = "#e57474"
success     = "#8ccf7e"
placeholder = "#3b4244"
selection   = { background = "#2d3b3e", foreground = "#dadada" }

[colors.text.links]
default = "#6cbfbf"
visited = "#67b0e8"

[colors.input]
border       = "#141b1e"
border_focus = "#6cbfbf"
border_error = "#e57474"

[colors.button.primary]
background = "#0e1416"
foreground = "#dadada"
hover      = { background = "#0e1416" }
focus      = { outline = "colors.core.accent" }

[colors.list.item.hover]
foreground           = "#dadada"
secondary_foreground = "#3b4244"

[colors.list.item.selection]
background           = "#232a2d"
foreground           = "#dadada"
secondary_background = "#141b1e"
secondary_foreground = "#3b4244"

[colors.grid.item]
background = "#141b1e"
hover      = { outline = "#dadada" }
selection  = { outline = "#dadada" }

[colors.scrollbars]
background = "#141b1e"

[colors.loading]
bar     = "#6cbfbf"
spinner = "#6cbfbf"

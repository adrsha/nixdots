[meta]
name        = "productive-light"
description = "Generated by theme-manager"
variant     = "dark"
inherits    = "vicinae-dark"

[colors.core]
accent               = "#B23E34"
accent_foreground    = "#FEFEFE"
background           = "#F4F5F6"
foreground           = "#2A2D32"
secondary_background = "#F4F5F6"
border               = "colors.core.background"

[colors.main_window]
border = "colors.core.background"
footer = { background = "colors.core.secondary_background" }

[colors.settings_window]
border = "colors.core.border"

[colors.accents]
blue    = "#2B7B82"
green   = "#347940"
magenta = "#654691"
orange  = "#4C3663"
red     = "#B23E34"
yellow  = "#926E1C"
cyan    = "#2B7B82"
purple  = "#654691"

[colors.shortcut]
border = "colors.core.border"

[colors.text]
default     = "#2A2D32"
muted       = "#B2B6BD"
danger      = "#B23E34"
success     = "#347940"
placeholder = "#B2B6BD"
selection   = { background = "#B2B6BD", foreground = "#2A2D32" }

[colors.text.links]
default = "#2B7B82"
visited = "#306BA6"

[colors.input]
border       = "#F4F5F6"
border_focus = "#2B7B82"
border_error = "#B23E34"

[colors.button.primary]
background = "#FEFEFE"
foreground = "#2A2D32"
hover      = { background = "#FEFEFE" }
focus      = { outline = "colors.core.accent" }

[colors.list.item.hover]
foreground           = "#2A2D32"
secondary_foreground = "#B2B6BD"

[colors.list.item.selection]
background           = "#EEEFF1"
foreground           = "#2A2D32"
secondary_background = "#F4F5F6"
secondary_foreground = "#B2B6BD"

[colors.grid.item]
background = "#F4F5F6"
hover      = { outline = "#2A2D32" }
selection  = { outline = "#2A2D32" }

[colors.scrollbars]
background = "#F4F5F6"

[colors.loading]
bar     = "#2B7B82"
spinner = "#2B7B82"

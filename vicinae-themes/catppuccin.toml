[meta]
name        = "catppuccin"
description = "Generated by set_theme.fish"
variant     = "dark"
inherits    = "vicinae-dark"

[colors.core]
accent               = "#f38ba8"
accent_foreground    = "#101019"
background           = "#181825"
foreground           = "#cdd6f4"
secondary_background = "#181825"
border               = "colors.core.background"

[colors.main_window]
border = "colors.core.background"
footer = { background = "colors.core.secondary_background" }

[colors.settings_window]
border = "colors.core.border"

[colors.accents]
blue    = "#94e2d5"
green   = "#a6e3a1"
magenta = "#f2cdcd"
orange  = "#f5c2e7"
red     = "#f38ba8"
yellow  = "#f9e2af"
cyan    = "#94e2d5"
purple  = "#cba6f7"

[colors.shortcut]
border = "colors.core.border"

[colors.text]
default     = "#cdd6f4"
muted       = "#45475a"
danger      = "#f38ba8"
success     = "#a6e3a1"
placeholder = "#45475a"
selection   = { background = "#45475a", foreground = "#cdd6f4" }

[colors.text.links]
default = "#94e2d5"
visited = "#89b4fa"

[colors.input]
border       = "#181825"
border_focus = "#94e2d5"
border_error = "#f38ba8"

[colors.button.primary]
background = "#101019"
foreground = "#cdd6f4"
hover      = { background = "#101019" }
focus      = { outline = "colors.core.accent" }

[colors.list.item.hover]
foreground           = "#cdd6f4"
secondary_foreground = "#45475a"

[colors.list.item.selection]
background           = "#1e1e2e"
foreground           = "#cdd6f4"
secondary_background = "#181825"
secondary_foreground = "#45475a"

[colors.grid.item]
background = "#181825"
hover      = { outline = "#cdd6f4" }
selection  = { outline = "#cdd6f4" }

[colors.scrollbars]
background = "#181825"

[colors.loading]
bar     = "#94e2d5"
spinner = "#94e2d5"

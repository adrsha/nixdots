[meta]
name        = "light_protocol"
description = "Generated by set_theme.fish"
variant     = "dark"
inherits    = "vicinae-dark"

[colors.core]
accent               = "#993d3d"
accent_foreground    = "#dbd8aa"
background           = "#d6d29f"
foreground           = "#2b291f"
secondary_background = "#d6d29f"
border               = "colors.core.background"

[colors.main_window]
border = "colors.core.background"
footer = { background = "colors.core.secondary_background" }

[colors.settings_window]
border = "colors.core.border"

[colors.accents]
blue    = "#4e6669"
green   = "#384230"
magenta = "#5c4a56"
orange  = "#8c4a42"
red     = "#993d3d"
yellow  = "#734f24"
cyan    = "#4e6669"
purple  = "#5c4a56"

[colors.shortcut]
border = "colors.core.border"

[colors.text]
default     = "#2b291f"
muted       = "#7f7a45"
danger      = "#993d3d"
success     = "#384230"
placeholder = "#7f7a45"
selection   = { background = "#7f7a45", foreground = "#2b291f" }

[colors.text.links]
default = "#4e6669"
visited = "#474435"

[colors.input]
border       = "#d6d29f"
border_focus = "#4e6669"
border_error = "#993d3d"

[colors.button.primary]
background = "#dbd8aa"
foreground = "#2b291f"
hover      = { background = "#dbd8aa" }
focus      = { outline = "colors.core.accent" }

[colors.list.item.hover]
foreground           = "#2b291f"
secondary_foreground = "#7f7a45"

[colors.list.item.selection]
background           = "#aea96d"
foreground           = "#2b291f"
secondary_background = "#d6d29f"
secondary_foreground = "#7f7a45"

[colors.grid.item]
background = "#d6d29f"
hover      = { outline = "#2b291f" }
selection  = { outline = "#2b291f" }

[colors.scrollbars]
background = "#d6d29f"

[colors.loading]
bar     = "#4e6669"
spinner = "#4e6669"

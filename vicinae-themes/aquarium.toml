[meta]
name        = "aquarium"
description = "Generated by set_theme.py"
variant     = "dark"
inherits    = "vicinae-dark"

[colors.core]
accent               = "#ebb9b9"
accent_foreground    = "#1a1a22"
background           = "#20202A"
foreground           = "#C6D0E9"
secondary_background = "#20202A"
border               = "colors.core.background"

[colors.main_window]
border = "colors.core.background"
footer = { background = "colors.core.secondary_background" }

[colors.settings_window]
border = "colors.core.border"

[colors.accents]
blue    = "#b8dceb"
green   = "#caf6bb"
magenta = "#f6bbe7"
orange  = "#cc9b9d"
red     = "#ebb9b9"
yellow  = "#ebe3b9"
cyan    = "#b8dceb"
purple  = "#f6bbe7"

[colors.shortcut]
border = "colors.core.border"

[colors.text]
default     = "#C6D0E9"
muted       = "#63718B"
danger      = "#ebb9b9"
success     = "#caf6bb"
placeholder = "#63718B"
selection   = { background = "#44495E", foreground = "#C6D0E9" }

[colors.text.links]
default = "#b8dceb"
visited = "#cddbf9"

[colors.input]
border       = "#20202A"
border_focus = "#b8dceb"
border_error = "#ebb9b9"

[colors.button.primary]
background = "#1a1a22"
foreground = "#C6D0E9"
hover      = { background = "#1a1a22" }
focus      = { outline = "colors.core.accent" }

[colors.list.item.hover]
foreground           = "#C6D0E9"
secondary_foreground = "#63718B"

[colors.list.item.selection]
background           = "#3b3b4d"
foreground           = "#C6D0E9"
secondary_background = "#20202A"
secondary_foreground = "#63718B"

[colors.grid.item]
background = "#20202A"
hover      = { outline = "#C6D0E9" }
selection  = { outline = "#C6D0E9" }

[colors.scrollbars]
background = "#20202A"

[colors.loading]
bar     = "#b8dceb"
spinner = "#b8dceb"

[meta]
name        = "carbon"
description = "Generated by theme-manager"
variant     = "dark"
inherits    = "vicinae-dark"

[colors.core]
accent               = "#6B6258"
accent_foreground    = "#010101"
background           = "#070706"
foreground           = "#D7D7D1"
secondary_background = "#070706"
border               = "colors.core.background"

[colors.main_window]
border = "colors.core.background"
footer = { background = "colors.core.secondary_background" }

[colors.settings_window]
border = "colors.core.border"

[colors.accents]
blue    = "#66797A"
green   = "#6F7D68"
magenta = "#736A7D"
orange  = "#5C5750"
red     = "#6B6258"
yellow  = "#A89A86"
cyan    = "#66797A"
purple  = "#736A7D"

[colors.shortcut]
border = "colors.core.border"

[colors.text]
default     = "#D7D7D1"
muted       = "#37342F"
danger      = "#6B6258"
success     = "#6F7D68"
placeholder = "#37342F"
selection   = { background = "#3D3B35", foreground = "#D7D7D1" }

[colors.text.links]
default = "#66797A"
visited = "#6B7380"

[colors.input]
border       = "#070706"
border_focus = "#66797A"
border_error = "#6B6258"

[colors.button.primary]
background = "#010101"
foreground = "#D7D7D1"
hover      = { background = "#010101" }
focus      = { outline = "colors.core.accent" }

[colors.list.item.hover]
foreground           = "#D7D7D1"
secondary_foreground = "#37342F"

[colors.list.item.selection]
background           = "#0C0C0B"
foreground           = "#D7D7D1"
secondary_background = "#070706"
secondary_foreground = "#37342F"

[colors.grid.item]
background = "#070706"
hover      = { outline = "#D7D7D1" }
selection  = { outline = "#D7D7D1" }

[colors.scrollbars]
background = "#070706"

[colors.loading]
bar     = "#66797A"
spinner = "#66797A"

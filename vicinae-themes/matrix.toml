[meta]
name        = "matrix"
description = "Generated by set_theme.fish"
variant     = "dark"
inherits    = "vicinae-dark"

[colors.core]
accent               = "#ff2222"
accent_foreground    = "#000100"
background           = "#000200"
foreground           = "#e6ffe6"
secondary_background = "#000200"
border               = "colors.core.background"

[colors.main_window]
border = "colors.core.background"
footer = { background = "colors.core.secondary_background" }

[colors.settings_window]
border = "colors.core.border"

[colors.accents]
blue    = "#00ff88"
green   = "#33ff66"
magenta = "#ff4477"
orange  = "#dd2266"
red     = "#ff2222"
yellow  = "#c8ff00"
cyan    = "#00ff88"
purple  = "#66cc33"

[colors.shortcut]
border = "colors.core.border"

[colors.text]
default     = "#e6ffe6"
muted       = "#164d21"
danger      = "#ff2222"
success     = "#33ff66"
placeholder = "#164d21"
selection   = { background = "#164d21", foreground = "#e6ffe6" }

[colors.text.links]
default = "#00ff88"
visited = "#00e644"

[colors.input]
border       = "#000200"
border_focus = "#00ff88"
border_error = "#ff2222"

[colors.button.primary]
background = "#000100"
foreground = "#e6ffe6"
hover      = { background = "#000100" }
focus      = { outline = "colors.core.accent" }

[colors.list.item.hover]
foreground           = "#e6ffe6"
secondary_foreground = "#164d21"

[colors.list.item.selection]
background           = "#031205"
foreground           = "#e6ffe6"
secondary_background = "#000200"
secondary_foreground = "#164d21"

[colors.grid.item]
background = "#000200"
hover      = { outline = "#e6ffe6" }
selection  = { outline = "#e6ffe6" }

[colors.scrollbars]
background = "#000200"

[colors.loading]
bar     = "#00ff88"
spinner = "#00ff88"

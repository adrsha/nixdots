[meta]
name        = "kusanagi"
description = "Generated by set_theme.py"
variant     = "dark"
inherits    = "vicinae-dark"

[colors.core]
accent               = "#ff3b3b"
accent_foreground    = "#030508"
background           = "#070b12"
foreground           = "#99e6ff"
secondary_background = "#070b12"
border               = "colors.core.background"

[colors.main_window]
border = "colors.core.background"
footer = { background = "colors.core.secondary_background" }

[colors.settings_window]
border = "colors.core.border"

[colors.accents]
blue    = "#3df2ff"
green   = "#409ccc"
magenta = "#e65585"
orange  = "#b32b53"
red     = "#ff3b3b"
yellow  = "#00ffaa"
cyan    = "#3df2ff"
purple  = "#8073ff"

[colors.shortcut]
border = "colors.core.border"

[colors.text]
default     = "#99e6ff"
muted       = "#2b3a54"
danger      = "#ff3b3b"
success     = "#409ccc"
placeholder = "#2b3a54"
selection   = { background = "#2b3a54", foreground = "#99e6ff" }

[colors.text.links]
default = "#3df2ff"
visited = "#33b5ff"

[colors.input]
border       = "#070b12"
border_focus = "#3df2ff"
border_error = "#ff3b3b"

[colors.button.primary]
background = "#030508"
foreground = "#99e6ff"
hover      = { background = "#030508" }
focus      = { outline = "colors.core.accent" }

[colors.list.item.hover]
foreground           = "#99e6ff"
secondary_foreground = "#2b3a54"

[colors.list.item.selection]
background           = "#0e1421"
foreground           = "#99e6ff"
secondary_background = "#070b12"
secondary_foreground = "#2b3a54"

[colors.grid.item]
background = "#070b12"
hover      = { outline = "#99e6ff" }
selection  = { outline = "#99e6ff" }

[colors.scrollbars]
background = "#070b12"

[colors.loading]
bar     = "#3df2ff"
spinner = "#3df2ff"

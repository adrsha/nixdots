[meta]
name        = "fog"
description = "Generated by set_theme.fish"
variant     = "dark"
inherits    = "vicinae-dark"

[colors.core]
accent               = "#cc4444"
accent_foreground    = "#0f1211"
background           = "#171c1b"
foreground           = "#b0bfbc"
secondary_background = "#171c1b"
border               = "colors.core.background"

[colors.main_window]
border = "colors.core.background"
footer = { background = "colors.core.secondary_background" }

[colors.settings_window]
border = "colors.core.border"

[colors.accents]
blue    = "#7aa69e"
green   = "#5c736e"
magenta = "#7c7080"
orange  = "#a66c53"
red     = "#cc4444"
yellow  = "#c9b68a"
cyan    = "#7aa69e"
purple  = "#7c7080"

[colors.shortcut]
border = "colors.core.border"

[colors.text]
default     = "#b0bfbc"
muted       = "#404d4a"
danger      = "#cc4444"
success     = "#5c736e"
placeholder = "#404d4a"
selection   = { background = "#404d4a", foreground = "#b0bfbc" }

[colors.text.links]
default = "#7aa69e"
visited = "#8fa3a0"

[colors.input]
border       = "#171c1b"
border_focus = "#7aa69e"
border_error = "#cc4444"

[colors.button.primary]
background = "#0f1211"
foreground = "#b0bfbc"
hover      = { background = "#0f1211" }
focus      = { outline = "colors.core.accent" }

[colors.list.item.hover]
foreground           = "#b0bfbc"
secondary_foreground = "#404d4a"

[colors.list.item.selection]
background           = "#1e2423"
foreground           = "#b0bfbc"
secondary_background = "#171c1b"
secondary_foreground = "#404d4a"

[colors.grid.item]
background = "#171c1b"
hover      = { outline = "#b0bfbc" }
selection  = { outline = "#b0bfbc" }

[colors.scrollbars]
background = "#171c1b"

[colors.loading]
bar     = "#7aa69e"
spinner = "#7aa69e"

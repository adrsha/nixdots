[meta]
name        = "tokio_paper"
description = "Generated by theme-manager"
variant     = "dark"
inherits    = "vicinae-dark"

[colors.core]
accent               = "#d6456a"
accent_foreground    = "#f5f3f8"
background           = "#ebe8f0"
foreground           = "#1a1624"
secondary_background = "#ebe8f0"
border               = "colors.core.background"

[colors.main_window]
border = "colors.core.background"
footer = { background = "colors.core.secondary_background" }

[colors.settings_window]
border = "colors.core.border"

[colors.accents]
blue    = "#2da3a6"
green   = "#2b8c68"
magenta = "#e87da0"
orange  = "#a63a82"
red     = "#d6456a"
yellow  = "#a68529"
cyan    = "#2da3a6"
purple  = "#8c3db8"

[colors.shortcut]
border = "colors.core.border"

[colors.text]
default     = "#1a1624"
muted       = "#c8c0d6"
danger      = "#d6456a"
success     = "#2b8c68"
placeholder = "#c8c0d6"
selection   = { background = "#c8c0d6", foreground = "#1a1624" }

[colors.text.links]
default = "#2da3a6"
visited = "#4b3db8"

[colors.input]
border       = "#ebe8f0"
border_focus = "#2da3a6"
border_error = "#d6456a"

[colors.button.primary]
background = "#f5f3f8"
foreground = "#1a1624"
hover      = { background = "#f5f3f8" }
focus      = { outline = "colors.core.accent" }

[colors.list.item.hover]
foreground           = "#1a1624"
secondary_foreground = "#c8c0d6"

[colors.list.item.selection]
background           = "#e0dce8"
foreground           = "#1a1624"
secondary_background = "#ebe8f0"
secondary_foreground = "#c8c0d6"

[colors.grid.item]
background = "#ebe8f0"
hover      = { outline = "#1a1624" }
selection  = { outline = "#1a1624" }

[colors.scrollbars]
background = "#ebe8f0"

[colors.loading]
bar     = "#2da3a6"
spinner = "#2da3a6"

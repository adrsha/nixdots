[meta]
name        = "corpo"
description = "Generated by set_theme.sh"
variant     = "dark"
inherits    = "vicinae-dark"

[colors.core]
accent               = ""
accent_foreground    = ""
background           = ""
foreground           = ""
secondary_background = ""
border               = "colors.core.background"

[colors.main_window]
border = "colors.core.background"
footer = { background = "colors.core.secondary_background" }

[colors.settings_window]
border = "colors.core.border"

[colors.accents]
blue    = ""
green   = ""
magenta = ""
orange  = ""
red     = ""
yellow  = ""
cyan    = ""
purple  = ""

[colors.shortcut]
border = "colors.core.border"

[colors.text]
default     = ""
muted       = "#1a2e1a"
danger      = ""
success     = ""
placeholder = "#1a2e1a"
selection   = { background = "", foreground = "" }

[colors.text.links]
default = ""
visited = ""

[colors.input]
border       = ""
border_focus = ""
border_error = ""

[colors.button.primary]
background = ""
foreground = ""
hover      = { background = "" }
focus      = { outline = "colors.core.accent" }

[colors.list.item.hover]
foreground           = ""
secondary_foreground = "#1a2e1a"

[colors.list.item.selection]
background           = "#060a06"
foreground           = ""
secondary_background = ""
secondary_foreground = "#1a2e1a"

[colors.grid.item]
background = ""
hover      = { outline = "" }
selection  = { outline = "" }

[colors.scrollbars]
background = ""

[colors.loading]
bar     = ""
spinner = ""

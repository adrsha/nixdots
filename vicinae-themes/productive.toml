[meta]
name        = "productive"
description = "Generated by theme-manager"
variant     = "dark"
inherits    = "vicinae-dark"

[colors.core]
accent               = "#C76960"
accent_foreground    = "#020202"
background           = "#090A0B"
foreground           = "#D3D5D9"
secondary_background = "#090A0B"
border               = "colors.core.background"

[colors.main_window]
border = "colors.core.background"
footer = { background = "colors.core.secondary_background" }

[colors.settings_window]
border = "colors.core.border"

[colors.accents]
blue    = "#5EB2BA"
green   = "#68B174"
magenta = "#9A83B9"
orange  = "#66507C"
red     = "#C76960"
yellow  = "#D3B369"
cyan    = "#5EB2BA"
purple  = "#9A83B9"

[colors.shortcut]
border = "colors.core.border"

[colors.text]
default     = "#D3D5D9"
muted       = "#414349"
danger      = "#C76960"
success     = "#68B174"
placeholder = "#414349"
selection   = { background = "#414349", foreground = "#D3D5D9" }

[colors.text.links]
default = "#5EB2BA"
visited = "#729ECA"

[colors.input]
border       = "#090A0B"
border_focus = "#5EB2BA"
border_error = "#C76960"

[colors.button.primary]
background = "#020202"
foreground = "#D3D5D9"
hover      = { background = "#020202" }
focus      = { outline = "colors.core.accent" }

[colors.list.item.hover]
foreground           = "#D3D5D9"
secondary_foreground = "#414349"

[colors.list.item.selection]
background           = "#101113"
foreground           = "#D3D5D9"
secondary_background = "#090A0B"
secondary_foreground = "#414349"

[colors.grid.item]
background = "#090A0B"
hover      = { outline = "#D3D5D9" }
selection  = { outline = "#D3D5D9" }

[colors.scrollbars]
background = "#090A0B"

[colors.loading]
bar     = "#5EB2BA"
spinner = "#5EB2BA"

[meta]
name        = "dark_protocol"
description = "Generated by set_theme.fish"
variant     = "dark"
inherits    = "vicinae-dark"

[colors.core]
accent               = "#c46060"
accent_foreground    = "#141208"
background           = "#1e1c10"
foreground           = "#edeac8"
secondary_background = "#1e1c10"
border               = "colors.core.background"

[colors.main_window]
border = "colors.core.background"
footer = { background = "colors.core.secondary_background" }

[colors.settings_window]
border = "colors.core.border"

[colors.accents]
blue    = "#5a8088"
green   = "#607a50"
magenta = "#907888"
orange  = "#b87870"
red     = "#c46060"
yellow  = "#a87840"
cyan    = "#5a8088"
purple  = "#907888"

[colors.shortcut]
border = "colors.core.border"

[colors.text]
default     = "#edeac8"
muted       = "#4a4730"
danger      = "#c46060"
success     = "#607a50"
placeholder = "#4a4730"
selection   = { background = "#6a6645", foreground = "#edeac8" }

[colors.text.links]
default = "#5a8088"
visited = "#888460"

[colors.input]
border       = "#1e1c10"
border_focus = "#5a8088"
border_error = "#c46060"

[colors.button.primary]
background = "#141208"
foreground = "#edeac8"
hover      = { background = "#141208" }
focus      = { outline = "colors.core.accent" }

[colors.list.item.hover]
foreground           = "#edeac8"
secondary_foreground = "#4a4730"

[colors.list.item.selection]
background           = "#2a2719"
foreground           = "#edeac8"
secondary_background = "#1e1c10"
secondary_foreground = "#4a4730"

[colors.grid.item]
background = "#1e1c10"
hover      = { outline = "#edeac8" }
selection  = { outline = "#edeac8" }

[colors.scrollbars]
background = "#1e1c10"

[colors.loading]
bar     = "#5a8088"
spinner = "#5a8088"

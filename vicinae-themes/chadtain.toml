[meta]
name        = "chadtain"
description = "Generated by theme-manager"
variant     = "dark"
inherits    = "vicinae-dark"

[colors.core]
accent               = "#735959"
accent_foreground    = "#0d1513"
background           = "#131C19"
foreground           = "#444F4C"
secondary_background = "#131C19"
border               = "colors.core.background"

[colors.main_window]
border = "colors.core.background"
footer = { background = "colors.core.secondary_background" }

[colors.settings_window]
border = "colors.core.border"

[colors.accents]
blue    = "#4c685f"
green   = "#395242"
magenta = "#5e526a"
orange  = "#4e3837"
red     = "#735959"
yellow  = "#7a573f"
cyan    = "#4c685f"
purple  = "#5e526a"

[colors.shortcut]
border = "colors.core.border"

[colors.text]
default     = "#444F4C"
muted       = "#2c382d"
danger      = "#735959"
success     = "#395242"
placeholder = "#2c382d"
selection   = { background = "#2c382d", foreground = "#444F4C" }

[colors.text.links]
default = "#4c685f"
visited = "#41575c"

[colors.input]
border       = "#131C19"
border_focus = "#4c685f"
border_error = "#735959"

[colors.button.primary]
background = "#0d1513"
foreground = "#444F4C"
hover      = { background = "#0d1513" }
focus      = { outline = "colors.core.accent" }

[colors.list.item.hover]
foreground           = "#444F4C"
secondary_foreground = "#2c382d"

[colors.list.item.selection]
background           = "#1a2622"
foreground           = "#444F4C"
secondary_background = "#131C19"
secondary_foreground = "#2c382d"

[colors.grid.item]
background = "#131C19"
hover      = { outline = "#444F4C" }
selection  = { outline = "#444F4C" }

[colors.scrollbars]
background = "#131C19"

[colors.loading]
bar     = "#4c685f"
spinner = "#4c685f"

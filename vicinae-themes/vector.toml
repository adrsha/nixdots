[meta]
name        = "vector"
description = "Generated by set_theme.fish"
variant     = "dark"
inherits    = "vicinae-dark"

[colors.core]
accent               = "#c25a5a"
accent_foreground    = "#010203"
background           = "#050708"
foreground           = "#b3ccc6"
secondary_background = "#050708"
border               = "colors.core.background"

[colors.main_window]
border = "colors.core.background"
footer = { background = "colors.core.secondary_background" }

[colors.settings_window]
border = "colors.core.border"

[colors.accents]
blue    = "#3d9e8a"
green   = "#3d8a78"
magenta = "#b07888"
orange  = "#8a5a68"
red     = "#c25a5a"
yellow  = "#7da198"
cyan    = "#3d9e8a"
purple  = "#7a8090"

[colors.shortcut]
border = "colors.core.border"

[colors.text]
default     = "#b3ccc6"
muted       = "#1d2629"
danger      = "#c25a5a"
success     = "#3d8a78"
placeholder = "#1d2629"
selection   = { background = "#1d2629", foreground = "#b3ccc6" }

[colors.text.links]
default = "#3d9e8a"
visited = "#5d9e96"

[colors.input]
border       = "#050708"
border_focus = "#3d9e8a"
border_error = "#c25a5a"

[colors.button.primary]
background = "#010203"
foreground = "#b3ccc6"
hover      = { background = "#010203" }
focus      = { outline = "colors.core.accent" }

[colors.list.item.hover]
foreground           = "#b3ccc6"
secondary_foreground = "#1d2629"

[colors.list.item.selection]
background           = "#0c0f12"
foreground           = "#b3ccc6"
secondary_background = "#050708"
secondary_foreground = "#1d2629"

[colors.grid.item]
background = "#050708"
hover      = { outline = "#b3ccc6" }
selection  = { outline = "#b3ccc6" }

[colors.scrollbars]
background = "#050708"

[colors.loading]
bar     = "#3d9e8a"
spinner = "#3d9e8a"

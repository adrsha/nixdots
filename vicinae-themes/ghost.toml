[meta]
name        = "ghost"
description = "Generated by set_theme.fish"
variant     = "dark"
inherits    = "vicinae-dark"

[colors.core]
accent               = "#e8e4e4"
accent_foreground    = "#000000"
background           = "#050505"
foreground           = "#d6d6db"
secondary_background = "#050505"
border               = "colors.core.background"

[colors.main_window]
border = "colors.core.background"
footer = { background = "colors.core.secondary_background" }

[colors.settings_window]
border = "colors.core.border"

[colors.accents]
blue    = "#a8b0b0"
green   = "#b0b2b0"
magenta = "#d8d4d6"
orange  = "#c8c4c6"
red     = "#e8e4e4"
yellow  = "#c8c4b8"
cyan    = "#a8b0b0"
purple  = "#909098"

[colors.shortcut]
border = "colors.core.border"

[colors.text]
default     = "#d6d6db"
muted       = "#363640"
danger      = "#e8e4e4"
success     = "#b0b2b0"
placeholder = "#363640"
selection   = { background = "#363640", foreground = "#d6d6db" }

[colors.text.links]
default = "#a8b0b0"
visited = "#c8c8d6"

[colors.input]
border       = "#050505"
border_focus = "#a8b0b0"
border_error = "#e8e4e4"

[colors.button.primary]
background = "#000000"
foreground = "#d6d6db"
hover      = { background = "#000000" }
focus      = { outline = "colors.core.accent" }

[colors.list.item.hover]
foreground           = "#d6d6db"
secondary_foreground = "#363640"

[colors.list.item.selection]
background           = "#0f0f12"
foreground           = "#d6d6db"
secondary_background = "#050505"
secondary_foreground = "#363640"

[colors.grid.item]
background = "#050505"
hover      = { outline = "#d6d6db" }
selection  = { outline = "#d6d6db" }

[colors.scrollbars]
background = "#050505"

[colors.loading]
bar     = "#a8b0b0"
spinner = "#a8b0b0"
